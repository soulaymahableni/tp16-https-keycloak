# Même Ingress que 20-ingress-tls.yaml, mais le trafic passe d'abord par oauth2-proxy.
# whoami n'est plus joignable directement depuis l'extérieur.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: tp16
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
    cert-manager.io/duration: 2160h
    cert-manager.io/renew-before: 720h
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - whoami.lab.local
      secretName: whoami-tls
  rules:
    - host: whoami.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
