# 1) Émetteur autosigné : sert UNIQUEMENT à fabriquer le certificat de la CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# 2) Certificat de la CA de lab (isCA: true), stocké dans le Secret lab-ca
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Lab CA TP16
  subject:
    organizations: ["DevOps Lab"]
  secretName: lab-ca
  duration: 87600h        # 10 ans
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# 3) TODO complété : émetteur "ca" qui signe avec la clé du Secret lab-ca.
# Pour un ClusterIssuer, le Secret est cherché dans le namespace cert-manager.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca
