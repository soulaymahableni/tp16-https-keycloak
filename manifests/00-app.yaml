apiVersion: v1
kind: Namespace
metadata:
  name: tp16
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: tp16
  labels:
    app: whoami
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.1
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: tp16
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
